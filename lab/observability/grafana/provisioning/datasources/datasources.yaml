apiVersion: 1
datasources:
  - name: Tempo
    uid: racmond-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    jsonData:
      tracesToMetrics:
        datasourceUid: racmond-prometheus
  - name: Prometheus
    uid: racmond-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
