name: Validate Racmond
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  polyglot-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure isolated local credentials
        run: |
          cp lab/.env.example lab/.env
          sed -i "s|racmond-local-demo-change-me|$(openssl rand -hex 32)|" lab/.env
          sed -i "s|racmond-local-pg|$(openssl rand -hex 24)|" lab/.env
          sed -i "s|racmond-local-redis|$(openssl rand -hex 24)|" lab/.env
          sed -i "s|racmond-local-grafana|$(openssl rand -hex 24)|" lab/.env
          sed -i "s|LARAVEL_APP_KEY=|LARAVEL_APP_KEY=base64:$(openssl rand -base64 32)|" lab/.env
      - run: docker compose -f lab/compose.yaml config --quiet
      - name: Build lab images
        run: docker compose -f lab/compose.yaml build --progress=plain 2>&1 | tee /tmp/lab-build.log
        timeout-minutes: 30
      - name: Start lab
        run: docker compose -f lab/compose.yaml up -d --wait 2>&1 | tee /tmp/lab-up.log
        timeout-minutes: 10
      - run: bash lab/smoke.sh
      - name: Capture service logs on failure
        if: failure()
        run: |
          docker compose -f lab/compose.yaml logs --tail=200 > /tmp/lab-services.log || true
          {
            echo '## Lab build tail'
            tail -c 20000 /tmp/lab-build.log 2>/dev/null || true
            echo '## Lab startup tail'
            tail -c 20000 /tmp/lab-up.log 2>/dev/null || true
            echo '## Service logs'
            tail -c 20000 /tmp/lab-services.log 2>/dev/null || true
          } > /tmp/lab-diagnostics.md
          cat /tmp/lab-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostics to the commit for restricted-egress review
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"             -f body="$(cat /tmp/lab-diagnostics.md)"
      - name: Destroy isolated lab volumes
        if: always()
        run: docker compose -f lab/compose.yaml down --volumes
